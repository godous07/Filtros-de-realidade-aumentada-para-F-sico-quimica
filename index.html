<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Filtro AR: Capilaridade e Lei de Jurin</title>
    
    <!-- Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #1a202c; font-family: 'Inter', sans-serif; }
        .video-container { position: relative; width: 100vw; height: 100vh; }
        
        /* O vídeo da câmera fica de fundo */
        .input_video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 1; }
        
        /* O canvas de desenho fica por cima do vídeo */
        .output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 10; pointer-events: none; }
        
        /* Painel da interface (HUD) */
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 1rem; }
        .interactive-panel { pointer-events: auto; }
        
        /* Spinner de carregamento */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 8px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800">

    <div class="video-container">
        <!-- Câmera e Canvas AR -->
        <video class="input_video" autoplay playsinline></video>
        <canvas class="output_canvas"></canvas>

        <!-- Interface de Usuário (HUD) -->
        <div class="hud-overlay">
            
            <!-- Cabeçalho / Título (Mais compacto para celular) -->
            <div class="bg-white/80 backdrop-blur-md rounded-2xl p-3 shadow-lg interactive-panel max-w-sm mx-auto w-full text-center">
                <h1 class="text-lg font-bold text-indigo-700 mb-1">Físico-Química AR</h1>
                <p class="text-xs text-gray-600 font-medium">Capilaridade (Lei de Jurin)</p>
                
                <div id="loadingIndicator" class="mt-3">
                    <div class="loader"></div>
                    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Iniciando Câmera...</p>
                </div>
                
                <p id="instructionText" class="text-xs text-gray-700 mt-2 hidden">Faça uma <strong>pinça com o polegar e indicador</strong> para controlar o tubo.</p>
            </div>

            <!-- Painel de Dados e Controles (Mais compacto e com margem menor no celular) -->
            <div class="bg-white/95 backdrop-blur-md rounded-2xl p-4 shadow-2xl interactive-panel max-w-sm mx-auto w-full mb-1">
                
                <!-- Seletor de Substância -->
                <div class="flex justify-center space-x-2 mb-3 bg-gray-200 p-1 rounded-xl">
                    <button id="btnAgua" class="flex-1 py-1.5 rounded-lg font-bold text-sm bg-blue-500 text-white shadow transition-all">💧 Água</button>
                    <button id="btnMercurio" class="flex-1 py-1.5 rounded-lg font-bold text-sm text-gray-600 hover:bg-white transition-all">⚪ Mercúrio</button>
                </div>

                <!-- Dados Físico-Químicos -->
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <div class="bg-blue-50 rounded-xl p-2 border border-blue-100 text-center">
                        <span class="block text-[10px] text-blue-500 font-bold uppercase tracking-wide">Raio (r)</span>
                        <span id="txtRaio" class="text-base font-black text-blue-900">-- mm</span>
                    </div>
                    <div class="bg-indigo-50 rounded-xl p-2 border border-indigo-100 text-center">
                        <span class="block text-[10px] text-indigo-500 font-bold uppercase tracking-wide">Altura (h)</span>
                        <span id="txtAltura" class="text-base font-black text-indigo-900">-- mm</span>
                    </div>
                </div>

                <!-- Informação Conceitual -->
                <div class="bg-gray-50 rounded-xl p-2 border border-gray-200 text-center">
                    <span class="block text-[10px] text-gray-500 font-bold uppercase tracking-wide mb-0.5">Interação Predominante</span>
                    <span id="txtForca" class="text-sm font-semibold text-gray-800 block mb-0.5">Aguardando...</span>
                    <p id="txtExplicacao" class="text-[11px] text-gray-600 leading-tight">Posicione os dedos para ver a simulação.</p>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Configurações e Constantes Físico-Químicas
        const fisQ = {
            g: 9.81, // Gravidade (m/s^2)
            agua: {
                nome: "Água",
                cor: "rgba(59, 130, 246, 0.7)", // Azul
                corBorda: "rgba(37, 99, 235, 1)",
                gamma: 0.0728, // Tensão superficial (N/m)
                rho: 1000, // Densidade (kg/m^3)
                theta: 0, // Ângulo de contato (radianos)
                forca: "Adesão > Coesão",
                explicacao: "A água interage fortemente com o vidro. O líquido sobe (menisco côncavo)."
            },
            mercurio: {
                nome: "Mercúrio",
                cor: "rgba(156, 163, 175, 0.8)", // Cinza Metálico
                corBorda: "rgba(107, 114, 128, 1)",
                gamma: 0.4865,
                rho: 13600,
                theta: 140 * (Math.PI / 180), // 140 graus em radianos
                forca: "Coesão > Adesão",
                explicacao: "O mercúrio se atrai mais entre si do que pelo vidro. O líquido desce (menisco convexo)."
            }
        };

        // Estado do App
        let substanciaAtual = fisQ.agua;
        
        // Elementos da Interface
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        
        const btnAgua = document.getElementById('btnAgua');
        const btnMercurio = document.getElementById('btnMercurio');
        const txtRaio = document.getElementById('txtRaio');
        const txtAltura = document.getElementById('txtAltura');
        const txtForca = document.getElementById('txtForca');
        const txtExplicacao = document.getElementById('txtExplicacao');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const instructionText = document.getElementById('instructionText');

        // Troca de Substância UI
        function setSubstancia(tipo) {
            if (tipo === 'agua') {
                substanciaAtual = fisQ.agua;
                btnAgua.className = "flex-1 py-1.5 rounded-lg font-bold text-sm bg-blue-500 text-white shadow transition-all";
                btnMercurio.className = "flex-1 py-1.5 rounded-lg font-bold text-sm text-gray-600 hover:bg-white transition-all";
            } else {
                substanciaAtual = fisQ.mercurio;
                btnMercurio.className = "flex-1 py-1.5 rounded-lg font-bold text-sm bg-gray-600 text-white shadow transition-all";
                btnAgua.className = "flex-1 py-1.5 rounded-lg font-bold text-sm text-gray-600 hover:bg-white transition-all";
            }
            atualizarHUDBase();
        }

        function atualizarHUDBase() {
            txtForca.innerText = substanciaAtual.forca;
            txtExplicacao.innerText = substanciaAtual.explicacao;
        }

        btnAgua.addEventListener('click', () => setSubstancia('agua'));
        btnMercurio.addEventListener('click', () => setSubstancia('mercurio'));
        atualizarHUDBase();

        // Lógica de Redimensionamento do Canvas
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // IA: Callback do MediaPipe Hands
        function onResults(results) {
            if (!loadingIndicator.classList.contains('hidden')) {
                loadingIndicator.classList.add('hidden');
                instructionText.classList.remove('hidden');
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // Apenas desenha se houver uma mão detectada
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Ponta do polegar (4) e do indicador (8)
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];

                // Converte coordenadas da IA para o Canvas
                const tX = thumbTip.x * canvasElement.width;
                const tY = thumbTip.y * canvasElement.height;
                const iX = indexTip.x * canvasElement.width;
                const iY = indexTip.y * canvasElement.height;

                // Distância em pixels
                const dx = tX - iX;
                const dy = tY - iY;
                const distancePx = Math.sqrt(dx*dx + dy*dy);

                // --- FÍSICA E LEI DE JURIN ---
                let raioMm = (distancePx / 80); 
                raioMm = Math.max(0.1, Math.min(raioMm, 4.0)); // Limita entre 0.1mm e 4.0mm
                const raioM = raioMm / 1000;

                // h = (2 * gamma * cos(theta)) / (rho * g * r)
                const hM = (2 * substanciaAtual.gamma * Math.cos(substanciaAtual.theta)) / (substanciaAtual.rho * fisQ.g * raioM);
                const hMm = hM * 1000; 

                // Atualiza UI
                txtRaio.innerText = raioMm.toFixed(2) + " mm";
                txtAltura.innerText = hMm.toFixed(2) + " mm";

                // --- DESENHO AR ---
                const midX = (tX + iX) / 2;
                const midY = (tY + iY) / 2;
                
                // AJUSTE PARA CELULAR: Levanta o béquer dependendo do tamanho da tela
                const isMobile = window.innerWidth < 768;
                const bequerY = isMobile ? canvasElement.height - 280 : canvasElement.height - 150; 
                const bequerLargura = isMobile ? 150 : 200;
                
                const larguraTuboVisual = Math.max(10, distancePx); 
                const scalaVisual = 15; 
                const alturaVisualH = -hMm * scalaVisual; 

                // Linha guia entre os dedos
                canvasCtx.beginPath();
                canvasCtx.moveTo(tX, tY);
                canvasCtx.lineTo(iX, iY);
                canvasCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                canvasCtx.lineWidth = 2;
                canvasCtx.stroke();
                
                // Pontos nos dedos
                canvasCtx.beginPath(); canvasCtx.arc(tX, tY, 5, 0, 2 * Math.PI); canvasCtx.fillStyle = '#10B981'; canvasCtx.fill();
                canvasCtx.beginPath(); canvasCtx.arc(iX, iY, 5, 0, 2 * Math.PI); canvasCtx.fillStyle = '#EF4444'; canvasCtx.fill();

                const nivelBaseY = bequerY - 40;
                const nivelTuboY = nivelBaseY + alturaVisualH;

                // Líquido no tubo
                canvasCtx.fillStyle = substanciaAtual.cor;
                canvasCtx.beginPath();
                canvasCtx.moveTo(midX - larguraTuboVisual/2, bequerY);
                canvasCtx.lineTo(midX - larguraTuboVisual/2, nivelTuboY);

                // Menisco
                const raioCurva = larguraTuboVisual / 2;
                if (substanciaAtual.nome === "Água") {
                    canvasCtx.quadraticCurveTo(midX, nivelTuboY + (raioCurva*0.8), midX + larguraTuboVisual/2, nivelTuboY);
                } else {
                    canvasCtx.quadraticCurveTo(midX, nivelTuboY - (raioCurva*0.8), midX + larguraTuboVisual/2, nivelTuboY);
                }

                canvasCtx.lineTo(midX + larguraTuboVisual/2, bequerY);
                canvasCtx.closePath();
                canvasCtx.fill();

                // Contorno Menisco
                canvasCtx.beginPath();
                canvasCtx.moveTo(midX - larguraTuboVisual/2, nivelTuboY);
                if (substanciaAtual.nome === "Água") {
                    canvasCtx.quadraticCurveTo(midX, nivelTuboY + (raioCurva*0.8), midX + larguraTuboVisual/2, nivelTuboY);
                } else {
                    canvasCtx.quadraticCurveTo(midX, nivelTuboY - (raioCurva*0.8), midX + larguraTuboVisual/2, nivelTuboY);
                }
                canvasCtx.strokeStyle = substanciaAtual.corBorda;
                canvasCtx.lineWidth = 3;
                canvasCtx.stroke();

                // Paredes do Tubo
                canvasCtx.strokeStyle = "rgba(255, 255, 255, 0.8)";
                canvasCtx.lineWidth = 4;
                canvasCtx.beginPath();
                canvasCtx.moveTo(midX - larguraTuboVisual/2, bequerY);
                canvasCtx.lineTo(midX - larguraTuboVisual/2, bequerY - 350);
                canvasCtx.moveTo(midX + larguraTuboVisual/2, bequerY);
                canvasCtx.lineTo(midX + larguraTuboVisual/2, bequerY - 350);
                canvasCtx.stroke();

                // Líquido no Béquer
                canvasCtx.fillStyle = substanciaAtual.cor;
                canvasCtx.fillRect(midX - bequerLargura/2, nivelBaseY, bequerLargura, bequerY - nivelBaseY);
                
                // Nível Béquer
                canvasCtx.strokeStyle = substanciaAtual.corBorda;
                canvasCtx.lineWidth = 2;
                canvasCtx.beginPath();
                canvasCtx.moveTo(midX - bequerLargura/2, nivelBaseY);
                canvasCtx.lineTo(midX + bequerLargura/2, nivelBaseY);
                canvasCtx.stroke();

            } else {
                txtRaio.innerText = "-- mm";
                txtAltura.innerText = "-- mm";
            }
            canvasCtx.restore();
        }

        // Inicializa MediaPipe
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        // Inicializa Câmera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        
        // Inicia câmera com tratamento de erro
        camera.start().catch((error) => {
            console.error("Erro de Câmera:", error);
            loadingIndicator.innerHTML = `
                <div class="bg-red-50 border border-red-200 rounded-lg p-3 mt-2">
                    <p class="text-xs font-bold text-red-600 uppercase">Câmera não encontrada/permitida</p>
                    <p class="text-xs text-red-500 mt-1">Verifique as permissões ou se há uma câmera conectada.</p>
                </div>
            `;
        });

    </script>
</body>
</html>
